
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="./manifest.webmanifest">
<title>EventLog</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f1;--card:#fff;--fg:#20211f;--muted:#74766f;--line:#e5e4dd;--soft:#e9eee9}
@media(prefers-color-scheme:dark){:root{--bg:#171815;--card:#22241f;--fg:#f0f0e9;--muted:#a9aaa1;--line:#383a33;--soft:#303b32}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:700px;margin:auto;padding:20px 14px 40px}
h1{font-size:30px;margin:0}h2{font-size:19px;margin:0 0 12px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin:13px 0}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.event{min-height:75px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--fg);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.event b{font-size:13px}.emoji{font-size:23px}
select,input,button{font:inherit}
select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-height:42px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{background:var(--soft);padding:12px;border-radius:12px;flex:1}
.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.day{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase;padding:12px 0 4px}
.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}
.row:last-child{border-bottom:0}
.ico{width:38px;height:38px;display:grid;place-items:center;background:var(--soft);border-radius:11px;font-size:20px}
.detail{flex:1}.time{font-weight:700;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;margin-top:12px}
.toolbar button{flex:1;padding:10px 6px;border:0;border-radius:10px;background:var(--soft);color:var(--fg);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:20px 0}
</style>
</head>
<body>
<main>
<header>
<p class="muted">REGISTRO PERSONAL · OFFLINE</p>
<h1>EventLog</h1>
<p class="muted">Un toque para registrar. Filtros para entender.</p>
</header>

<section class="card">
<h2>Registrar evento</h2>
<div class="buttons" id="buttons"></div>
<p class="muted">Toca un botón para guardar la fecha y hora actuales.</p>
</section>

<section class="card">
<h2>Historial</h2>
<label for="filter" class="muted">Categoría</label>
<select id="filter">
<option value="all">Todos los eventos</option>
<option value="food">Comidas</option>
<option value="medicine">Medicamentos</option>
<option value="sleep">Sueño y cama</option>
<option value="smoking">Fumar</option>
<option value="drinking">Beber</option>
<option value="other">Otros</option>
</select>

<div class="filters">
<div><label class="muted" for="from">Desde</label><input type="date" id="from"></div>
<div><label class="muted" for="to">Hasta</label><input type="date" id="to"></div>
</div>

<div class="stats">
<div class="stat"><strong id="count">0</strong><span>eventos visibles</span></div>
<div class="stat"><strong id="days">0</strong><span>días con registros</span></div>
</div>

<div id="history"></div>
<div class="toolbar">
<button id="import">Importar CSV</button>
<button id="export">Exportar CSV</button>
<button id="backup">Copia JSON</button>
</div>
<input type="file" id="file" accept=".csv,text/csv" hidden>
<p id="status" class="muted" role="status"></p>
</section>
<p class="muted" style="text-align:center">EventLog · Prototipo · Los datos se guardan en este navegador.</p>
</main>

<script>
'use strict';

const KEY='eventlog.events.v1';

const types=[
 ['viatris','Medicamento','💊','medicine'],
 ['ate','Comer','🍽️','food'],
 ['on bed','Acostarme','🛏️','sleep'],
 ['sleep','Dormirme','🌙','sleep'],
 ['wake','Despertarme','🌅','sleep'],
 ['off bed','Levantarme','🧍','sleep'],
 ['smoke','Fumar','🚬','smoking'],
 ['drink','Beber','🥤','drinking']
];

const $=id=>document.getElementById(id);

function category(key){
 const s=String(key||'').toLowerCase();
 if(/viatris|med|pill|medicamento/.test(s))return 'medicine';
 if(/ate|eat|food|comid|meal/.test(s))return 'food';
 if(/sleep|wake|bed|dorm|despert|acost|levant/.test(s))return 'sleep';
 if(/smok|fumar|cig/.test(s))return 'smoking';
 if(/drink|beber|alcohol/.test(s))return 'drinking';
 return 'other';
}

function label(key){
 const t=types.find(x=>x[0]===key);
 return t?t[1]:key;
}

function emoji(key){
 const t=types.find(x=>x[0]===key);
 return t?t[2]:'•';
}

function nowParts(d=new Date()){
 const date=[
  d.getFullYear(),
  String(d.getMonth()+1).padStart(2,'0'),
  String(d.getDate()).padStart(2,'0')
 ].join('-');

 const time=[
  String(d.getHours()).padStart(2,'0'),
  String(d.getMinutes()).padStart(2,'0'),
  String(d.getSeconds()).padStart(2,'0')
 ].join(':');

 return {date:date,time:time};
}

function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY)||'[]');
  return Array.isArray(x)?x:[];
 }catch(e){
  return [];
 }
}

let events=load();

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(events));
  $('status').textContent='Guardado en este dispositivo.';
 }catch(e){
  $('status').textContent='No se pudo guardar. Exporta una copia.';
 }
}

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c]));
}

function add(key){
 const t=nowParts();
 events.push({
  id:Date.now()+'-'+Math.random(),
  date:t.date,
  time:t.time,
  button:key,
  memo:'',
  category:category(key)
 });
 save();
 render();
 $('status').textContent='Registrado: '+label(key)+' · '+t.time;
}

function renderButtons(){
 $('buttons').innerHTML=types.map(t=>
  '<button class="event" data-key="'+esc(t[0])+'">'+
  '<span class="emoji">'+t[2]+'</span>'+
  '<b>'+esc(t[1])+'</b></button>'
 ).join('');

 $('buttons').querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>add(b.dataset.key));
 });
}

function parseCSV(s){
 const out=[];
 let row=[],v='',q=false;

 for(let i=0;i<s.length;i++){
  let c=s[i];

  if(q){
   if(c==='"'&&s[i+1]==='"'){v+='"';i++;}
   else if(c==='"')q=false;
   else v+=c;
  }else if(c==='"')q=true;
  else if(c===','){row.push(v);v='';}
  else if(c==='\n'){row.push(v);out.push(row);row=[];v='';}
  else if(c!=='\r')v+=c;
 }

 if(v||row.length){row.push(v);out.push(row);}
 if(!out.length)return [];

 const h=out.shift().map(x=>x.trim().toLowerCase());

 return out.filter(r=>r.some(x=>x.trim())).map(r=>
  Object.fromEntries(h.map((k,i)=>[k,r[i]||'']))
 );
}

function render(){
 const cat=$('filter').value;
 const from=$('from').value;
 const to=$('to').value;

 const list=events.filter(e=>
  (cat==='all'||(e.category||category(e.button))===cat)&&
  (!from||e.date>=from)&&
  (!to||e.date<=to)
 ).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

 $('count').textContent=list.length;
 $('days').textContent=new Set(list.map(e=>e.date)).size;

 let html='',last='';

 for(const e of list){
  if(e.date!==last){
   last=e.date;
   const d=new Date(e.date+'T12:00:00');
   html+='<div class="day">'+esc(
    isNaN(d)?e.date:d.toLocaleDateString('es-ES',{
     weekday:'short',day:'numeric',month:'short',year:'numeric'
    })
   )+'</div>';
  }

  html+='<div class="row">'+
   '<div class="ico">'+emoji(e.button)+'</div>'+
   '<div class="detail"><b>'+esc(label(e.button))+'</b>'+
   '<div class="muted">'+esc(e.memo||'')+'</div></div>'+
   '<div class="time">'+esc(e.time)+'</div></div>';
 }

 $('history').innerHTML=html||
  '<div class="empty">No hay eventos en esta vista. Registra uno o importa tu CSV.</div>';
}

$('filter').addEventListener('change',render);
$('from').addEventListener('change',render);
$('to').addEventListener('change',render);

$('import').addEventListener('click',()=>$('file').click());

$('file').addEventListener('change',async e=>{
 const f=e.target.files[0];
 if(!f)return;

 try{
  const rows=parseCSV(await f.text());
  let n=0;

  const seen=new Set(events.map(x=>
   [x.date,x.time,x.button,x.memo].join('|')
  ));

  for(const r of rows){
   const key=String(r.button||r.event_type||r.type||'other').trim();
   const now=nowParts();

   const d={
    id:Date.now()+'-'+Math.random(),
    date:r.date||now.date,
    time:r.time||now.time,
    button:key,
    memo:r.memo||'',
    category:category(key)
   };

   const sig=[d.date,d.time,d.button,d.memo].join('|');

   if(!seen.has(sig)){
    events.push(d);
    seen.add(sig);
    n++;
   }
  }

  save();
  render();
  $('status').textContent='Importación: '+n+' registros nuevos de '+rows.length+'.';
 }catch(err){
  $('status').textContent='Error al importar: '+err.message;
 }

 e.target.value='';
});

function download(name,content,type){
 const a=document.createElement('a');
 const u=URL.createObjectURL(new Blob([content],{type}));
 a.href=u;
 a.download=name;
 a.click();
 setTimeout(()=>URL.revokeObjectURL(u),1000);
}

$('export').addEventListener('click',()=>{
 const rows=[
  ['date','time','button','memo'],
  ...events.map(e=>[e.date,e.time,e.button,e.memo])
 ];

 const csv=rows.map(r=>r.map(v=>{
  v=String(v??'');
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
 }).join(',')).join('\r\n');

 download('eventlog.csv','\ufeff'+csv,'text/csv;charset=utf-8');
});

$('backup').addEventListener('click',()=>{
 download('eventlog-backup.json',JSON.stringify(events,null,2),'application/json');
});

renderButtons();
render();
</script>
</body>
</html>
